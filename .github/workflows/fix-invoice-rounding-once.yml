name: Fix invoice rounding once

on:
  push:
    branches:
      - qa
    paths:
      - .github/workflows/fix-invoice-rounding-once.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Apply minimal rounding fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/Pages/WorkShopInvoice.jsx")
          text = path.read_text()

          old_import = 'import { buildInvoicePaymentContract } from "../utils/invoicePayment";\n'
          new_import = old_import + 'import { calculateNetLineAndUnit } from "../utils/invoiceRounding";\n'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit("invoicePayment import anchor not found")
              text = text.replace(old_import, new_import, 1)

          old_calc = '''  const netTotal = round2(quantity * price * (1 - discount / 100));
          const unitNet = quantity > 0 ? round2(netTotal / quantity) : 0;'''
          new_calc = '''  const { unitNet } = calculateNetLineAndUnit({
            quantity,
            price,
            discountPct: discount,
          });'''
          if new_calc not in text:
              if old_calc not in text:
                  # tolerate normal two-space indentation from source
                  old_calc = '''  const netTotal = round2(quantity * price * (1 - discount / 100));
  const unitNet = quantity > 0 ? round2(netTotal / quantity) : 0;'''
                  new_calc = '''  const { unitNet } = calculateNetLineAndUnit({
    quantity,
    price,
    discountPct: discount,
  });'''
              if old_calc not in text:
                  raise SystemExit("rounding calculation anchor not found")
              text = text.replace(old_calc, new_calc, 1)

          filter_anchor = '''      }))
      .filter(
        (item) =>'''
          normalize_step = '''      }))
      .map((item) =>
        normalizeInvoiceLineForTotals(item, item.ivaPct ?? 21, true),
      )
      .filter(
        (item) =>'''
          if normalize_step not in text:
              if filter_anchor not in text:
                  raise SystemExit("parseOrderItems filter anchor not found")
              text = text.replace(filter_anchor, normalize_step, 1)

          path.write_text(text)

      - name: Add reusable rounding helper
        shell: bash
        run: |
          cat > src/utils/invoiceRounding.js <<'EOF'
          export const roundInvoiceAmount = (value) =>
            Math.round((Number(value) + Number.EPSILON) * 100) / 100;

          export function calculateNetLineAndUnit({
            quantity,
            price,
            discountPct = 0,
          }) {
            const normalizedQuantity = Number(quantity || 0);
            const normalizedPrice = Number(price || 0);
            const normalizedDiscount = Math.min(
              100,
              Math.max(0, Number(discountPct || 0)),
            );

            const netTotal = roundInvoiceAmount(
              normalizedQuantity *
                normalizedPrice *
                (1 - normalizedDiscount / 100),
            );

            return {
              netTotal,
              // Keep the precision needed to reconstruct the rounded line total.
              // Rounding this unit value to cents can create phantom cents when
              // it is multiplied by quantity again during invoice calculation.
              unitNet:
                normalizedQuantity > 0 ? netTotal / normalizedQuantity : 0,
            };
          }
          EOF

      - name: Add regression test for 555.86 vs 555.91 case
        shell: bash
        run: |
          cat > src/utils/invoiceRounding.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            calculateNetLineAndUnit,
            roundInvoiceAmount,
          } from "./invoiceRounding.js";

          test("preserves 555.86 instead of creating 555.91 from unit rounding", () => {
            // This line contributes the exact 0.05 discrepancy reported in QA:
            // correct line total 100.05, but the old code rounded 10.005 to 10.01
            // and then reconstructed the line as 100.10.
            const sensitiveLine = calculateNetLineAndUnit({
              quantity: 10,
              price: 10.005,
              discountPct: 0,
            });

            const unaffectedLinesTotal = 455.81;
            const correctedInvoiceTotal = roundInvoiceAmount(
              sensitiveLine.unitNet * 10 + unaffectedLinesTotal,
            );
            const legacyInvoiceTotal = roundInvoiceAmount(
              roundInvoiceAmount(sensitiveLine.unitNet) * 10 +
                unaffectedLinesTotal,
            );

            assert.equal(sensitiveLine.netTotal, 100.05);
            assert.equal(correctedInvoiceTotal, 555.86);
            assert.equal(legacyInvoiceTotal, 555.91);
            assert.equal(roundInvoiceAmount(555.86 - correctedInvoiceTotal), 0);
          });

          test("quantity one keeps the existing cent result", () => {
            const line = calculateNetLineAndUnit({
              quantity: 1,
              price: 123.456,
              discountPct: 0,
            });

            assert.equal(line.netTotal, 123.46);
            assert.equal(line.unitNet, 123.46);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build QA
        run: npm run build:qa

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-invoice-rounding-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Pages/WorkShopInvoice.jsx src/utils/invoiceRounding.js src/utils/invoiceRounding.test.js .github/workflows/fix-invoice-rounding-once.yml
          git commit -m "fix: preserve invoice line rounding precision"
          git push origin qa
